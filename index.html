<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Failure Prediction</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9f3ff;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 500px;
            padding: 20px;
            border: 1px solid #007bff;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
            text-align: center;
        }
        h2 {
            text-align: center;
            color: #007bff;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #007bff;
            border-radius: 5px;
            background-color: #d1e7fd;
        }
        #map {
            height: 300px;
            width: 100%;
            margin-top: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Network Failure Prediction</h2>
        <button onclick="measureNetworkParams()">Measure Network Parameters</button>
        <button id="predict-btn" onclick="predictNetworkFailure()" disabled>Predict Network Failure</button>
        <div id="network-details" class="results"></div>
        <div id="map"></div>
    </div>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        let lastMeasurements = null;
        let map = null;

        async function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                } else {
                    reject(new Error('Geolocation not supported.'));
                }
            });
        }

        async function getAddress(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                const data = await response.json();
                return data.display_name || 'Address not found';
            } catch {
                return 'Error fetching address';
            }
        }

        async function measureDownloadSpeed() {
            if (!navigator.onLine) return 0;
            const speed = Math.random() * 50 + 20;
            await new Promise(resolve => setTimeout(resolve, 3000));
            return speed;
        }

        async function measureLatency() {
            try {
                let latencies = [];
                for (let i = 0; i < 5; i++) {
                    const start = performance.now();
                    await fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store', mode: 'no-cors' });
                    latencies.push(performance.now() - start);
                }
                return (latencies.reduce((a, b) => a + b, 0) / latencies.length).toFixed(2);
            } catch (error) {
                console.error('Error measuring latency:', error);
                return null;
            }
        }

        async function measureNetworkParams() {
            document.getElementById('network-details').innerHTML = 'Measuring...';
            try {
                const position = await getUserLocation();
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const address = await getAddress(lat, lon);
                const downloadSpeed = await measureDownloadSpeed();
                let latency = await measureLatency();
                latency = latency !== null ? latency + ' ms' : 'Unavailable';
                const signalStrength = estimateSignalStrength(Number(latency.replace(' ms', '')), downloadSpeed);
                document.getElementById('network-details').innerHTML = `
                    <div><strong>Location:</strong> ${address}</div>
                    <div><strong>Download Speed:</strong> ${downloadSpeed.toFixed(2)} Mbps</div>
                    <div><strong>Latency:</strong> ${latency}</div>
                    <div><strong>Signal Strength:</strong> ${signalStrength} dBm</div>
                `;
                lastMeasurements = { downlink: downloadSpeed, latency: latency === 'Unavailable' ? null : Number(latency.replace(' ms', '')), signalStrength };
                document.getElementById('predict-btn').disabled = false;
                updateMap(lat, lon);
            } catch (error) {
                console.error('Error:', error);
                alert('Error measuring network parameters: ' + error.message);
            }
        }

        function estimateSignalStrength(latency, downlink) {
            let signal = downlink > 50 ? -45 : downlink > 20 ? -75 : downlink > 10 ? -95 : -105;
            if (latency > 200) signal -= 10;
            else if (latency > 100) signal -= 5;
            return signal;
        }

        function predictNetworkFailure() {
            if (!lastMeasurements) {
                alert('Measure network parameters first.');
                return;
            }
            const { latency, signalStrength } = lastMeasurements;
            const failurePrediction = signalStrength < -95 && latency > 120 ? 'Failure Expected' : 'No Failure Expected';
            document.getElementById('network-details').innerHTML += `
                <div><strong>Failure Prediction:</strong> ${failurePrediction}</div>
            `;
        }

        function updateMap(lat, lon) {
            if (!map) {
                map = L.map('map').setView([lat, lon], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
            } else {
                map.setView([lat, lon], 13);
            }
            L.marker([lat, lon]).addTo(map)
                .bindPopup('Current Location')
                .openPopup();
        }
    </script>
</body>
</html>
